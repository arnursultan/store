{% extends "base.html" %}

{% block content %}

<div class="container mx-auto p-6">

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

{% for product in products %}

<div class="bg-white rounded-xl shadow hover:shadow-2xl transition duration-300 p-4 flex flex-col">

<!-- IMAGE -->

<div class="aspect-[4/3] overflow-hidden rounded-lg bg-gray-100 flex items-center justify-center">

{% if product.image %}

<img
src="{{ product.image.url }}"
alt="{{ product.name }}"
loading="lazy"
class="w-full h-full object-cover hover:scale-105 transition duration-300"
/>

{% else %}

<span class="text-gray-400 text-sm">
Нет фото
</span>

{% endif %}

</div>

<!-- TITLE -->

<h2 class="text-lg font-semibold mt-3 line-clamp-2">
{{ product.name }}
</h2>

<!-- PRICE -->

<p class="text-green-600 font-bold mt-1">
{{ product.price }} сом
</p>

<!-- ACTIONS -->

<div class="flex items-center justify-between mt-auto pt-4">

<a href="/product/{{ product.id }}"
class="text-sm text-blue-500 hover:underline">
Подробнее
</a>

<div class="flex items-center gap-2">

<a href="/cart/add/{{ product.id }}/"
class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg text-sm shadow transition">
🛒
</a>

<a href="{% url 'toggle_favorite' product.id %}"
class="text-xl hover:scale-110 transition
{% if product.id in favorite_ids %}
text-red-500
{% else %}
text-gray-400
{% endif %}">
❤️
</a>

</div>

</div>

</div>

{% empty %}

<p class="text-gray-500 col-span-4 text-center">
Товары не найдены
</p>

{% endfor %}

</div>
</div>

{% endblock %}
