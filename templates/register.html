{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh] bg-gray-50">

<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">

<h1 class="text-3xl font-bold mb-6 text-center">
Регистрация
</h1>

<form method="POST" class="space-y-5">

{% csrf_token %}

{% for field in form %}

<div>

<label class="block text-sm font-medium mb-1 text-gray-700">
{{ field.label }}
</label>

<input
type="{{ field.field.widget.input_type }}"
name="{{ field.name }}"
class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
/>

{% if field.errors %}
<p class="text-red-500 text-sm mt-1">
{{ field.errors }}
</p>
{% endif %}

</div>

{% endfor %}

<button
type="submit"
class="w-full bg-blue-500 hover:bg-blue-600 active:scale-95 text-white py-2 rounded-lg font-semibold shadow-md transition duration-200">

Зарегистрироваться

</button>

</form>

<p class="text-center text-gray-500 mt-6">

Уже есть аккаунт?

<a href="/users/login/" class="text-blue-500 hover:underline font-medium">
Войти
</a>

</p>

</div>

</div>

{% endblock %}
