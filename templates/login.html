{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh]">

<div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">

<h1 class="text-3xl font-bold mb-6 text-center">
Вход
</h1>

<form method="POST" class="space-y-4">

{% csrf_token %}

<input
name="username"
placeholder="Username"
class="border rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400"
required
>

<input
name="password"
type="password"
placeholder="Password"
class="border rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400"
required
>

<button
class="bg-blue-500 hover:bg-blue-600 text-white w-full py-2 rounded transition">
Войти
</button>

</form>

<p class="text-center text-gray-500 mt-4">

Нет аккаунта?

<a href="/users/register/" class="text-blue-500 hover:underline">
Регистрация
</a>

</p>

</div>

</div>

{% endblock %}
